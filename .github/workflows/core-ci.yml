name: Core CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    name: Foundation checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Keep this version in lockstep with package.json#packageManager.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Restore pinned offline test inputs removed from the live dataset tree
        run: node scripts/restore-archived-test-fixtures.mjs

      - name: Validate the active owner publication catalog
        run: pnpm exec vitest run --config vitest.release.config.mts scripts/owner-publication-catalog.test.ts

      - name: Unit and component tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # test:e2e builds and exercises the static SPA preview path, including
      # application deep links. No DB or Neon secrets are used.
      - name: Playwright production-preview smoke
        run: pnpm test:e2e

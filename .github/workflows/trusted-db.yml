name: Trusted DB Integration

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Full 40-character immutable commit SHA to validate"
        required: true
        type: string

permissions:
  contents: read

# test:db performs migration/reset/migration against the shared-ci target.
# Serialize all runs so the shared Neon branch cannot be mutated concurrently.
concurrency:
  group: vocabflow-neon-test-migration
  cancel-in-progress: false

jobs:
  trusted-db:
    # This workflow intentionally has no pull_request trigger. Keep the guard
    # as defense in depth so secrets can never reach fork/untrusted PR code.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXECUTION_CONTEXT: ci-test
      VOCABFLOW_ENV: test
      DATABASE_ENV: test
      # Purpose-specific credentials. DATABASE_URL is deliberately not set:
      # trusted CI must never fall back to a production connection.
      BOOTSTRAP_DATABASE_URL: ${{ secrets.BOOTSTRAP_DATABASE_URL }}
      NEON_TEST_IDENTITY_PROVISION_DATABASE_URL: ${{ secrets.NEON_TEST_IDENTITY_PROVISION_DATABASE_URL }}
      NEON_TEST_MIGRATION_DATABASE_URL: ${{ secrets.NEON_TEST_MIGRATION_DATABASE_URL }}
      NEON_TEST_RUNTIME_DATABASE_URL: ${{ secrets.NEON_TEST_RUNTIME_DATABASE_URL }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      # Resolve and validate the target before checkout. The value is passed
      # only as an actions/checkout input, never interpolated into shell code.
      - name: Validate Trusted DB target SHA
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          MANUAL_SHA: ${{ inputs.target_sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            target_sha="$MANUAL_SHA"
          else
            target_sha="$PUSH_SHA"
          fi
          if [[ ! "$target_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'Trusted DB target must be a full 40-character hexadecimal SHA.' >&2
            exit 1
          fi
          target_sha="${target_sha,,}"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.target_sha }}
          fetch-depth: 0

      - name: Verify Trusted DB checkout SHA
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo 'Trusted DB checkout SHA mismatch.' >&2
            exit 1
          fi
          echo "Trusted DB target SHA: $TARGET_SHA"
          echo "Trusted DB checkout HEAD: $actual_sha"

      # Keep this version in lockstep with package.json#packageManager.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A missing migration URL means the trusted DB job is not configured.
      # Check only presence here so bootstrap never mutates a target when the
      # trusted integration has been intentionally skipped.
      - name: Check trusted DB availability
        id: secret_gate
        shell: bash
        env:
          TEST_MIGRATION_URL: ${{ secrets.NEON_TEST_MIGRATION_DATABASE_URL }}
        run: |
          if [[ -z "$TEST_MIGRATION_URL" ]]; then
            echo 'status=SKIPPED_NO_TEST_DATABASE_SECRET' >> "$GITHUB_OUTPUT"
            echo 'run_db=false' >> "$GITHUB_OUTPUT"
            echo 'TRUSTED_DB_STATUS=SKIPPED_NO_TEST_DATABASE_SECRET'
          else
            echo 'status=READY' >> "$GITHUB_OUTPUT"
            echo 'run_db=true' >> "$GITHUB_OUTPUT"
          fi

      # Phase 1 verifies only BOOTSTRAP_DATABASE_URL and NEON_API_KEY. The
      # resolver performs the Neon provider proof for the bootstrap target.
      - name: Bootstrap preflight and provider verification
        id: bootstrap_preflight
        if: ${{ steps.secret_gate.outputs.run_db == 'true' }}
        shell: bash
        continue-on-error: true
        run: |
          set +e
          pnpm db:bootstrap-preflight 2>&1 | tee "$RUNNER_TEMP/vocabflow-bootstrap-preflight.log"
          command_status=${PIPESTATUS[0]}
          status=$(grep -Eo 'TRUSTED_DB_STATUS=[A-Z0-9_]+' "$RUNNER_TEMP/vocabflow-bootstrap-preflight.log" | tail -n 1 | cut -d= -f2)
          run_db=$(grep -E '^run_db=(true|false)$' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2)
          if [[ -z "$status" ]]; then
            if [[ "$command_status" -eq 0 && "$run_db" == "true" ]]; then status=PASS; else status=FAIL; fi
          fi
          if [[ "$status" == "PASS" ]]; then run_db=true; else run_db=false; fi
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          printf 'run_db=%s\n' "$run_db" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Handle bootstrap preflight status
        if: ${{ steps.secret_gate.outputs.run_db == 'true' }}
        run: |
          status='${{ steps.bootstrap_preflight.outputs.status }}'
          if [[ "$status" != "PASS" ]]; then
            echo "TRUSTED_DB_STATUS=$status"
            exit 1
          fi

      # db:bootstrap is idempotent for valid protected v1 state and creates
      # canonical roles/metadata only when the target is fresh.
      - name: Bootstrap protected metadata and roles
        if: ${{ steps.bootstrap_preflight.outputs.run_db == 'true' }}
        run: pnpm db:bootstrap

      # Phase 2 runs only after bootstrap. It verifies all post-bootstrap role
      # URLs and their Neon provider target fingerprints.
      - name: Full DB preflight and provider verification
        id: full_preflight
        if: ${{ steps.bootstrap_preflight.outputs.run_db == 'true' }}
        shell: bash
        continue-on-error: true
        env:
          TRUSTED_DB_EXECUTION_STARTED: true
        run: |
          set +e
          pnpm db:preflight 2>&1 | tee "$RUNNER_TEMP/vocabflow-full-preflight.log"
          command_status=${PIPESTATUS[0]}
          status=$(grep -Eo 'TRUSTED_DB_STATUS=[A-Z0-9_]+' "$RUNNER_TEMP/vocabflow-full-preflight.log" | tail -n 1 | cut -d= -f2)
          run_db=$(grep -E '^run_db=(true|false)$' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2)
          if [[ -z "$status" ]]; then
            if [[ "$command_status" -eq 0 && "$run_db" == "true" ]]; then status=PASS; else status=FAIL; fi
          fi
          if [[ "$status" == "PASS" ]]; then run_db=true; else run_db=false; fi
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          printf 'run_db=%s\n' "$run_db" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Handle full preflight status
        if: ${{ steps.bootstrap_preflight.outputs.run_db == 'true' }}
        run: |
          status='${{ steps.full_preflight.outputs.status }}'
          run_db='${{ steps.full_preflight.outputs.run_db }}'
          if [[ "$status" != "PASS" || "$run_db" != "true" ]]; then
            echo "TRUSTED_DB_STATUS=$status"
            exit 1
          fi

      - name: Provision canonical identity
        if: ${{ steps.full_preflight.outputs.run_db == 'true' }}
        run: pnpm db:identity-provision

      # test:db is the sole owner of the approved migration/reset/migration
      # acceptance sequence. Do not add separate migration or reset steps here.
      - name: Run trusted DB acceptance
        if: ${{ steps.full_preflight.outputs.run_db == 'true' }}
        run: pnpm test:db
